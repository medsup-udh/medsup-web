<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำขอวางประเมินวัสดุการแพทย์</title>
<link rel="stylesheet" href="app.css">
<style>
  main.v { max-width:760px; margin:0 auto; padding:14px 16px 40px; }
  .v-ann { border-left:4px solid var(--brand); }
  .v-ann h1 { font-size:21px; margin:0 0 4px; }
  .v-ann ol { padding-left:22px; margin:4px 0 8px; } .v-ann li { margin:2px 0; }
  .v-ann h3 { font-size:16px; margin:12px 0 2px; }
  .v-big { display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit; }
  .v-big b { font-size:18px; } .v-big:hover { border-color:var(--brand); }
  .v-choice { display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 6px; }
  .v-choice button { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:400; }
  .v-choice button[aria-pressed="true"] { background:var(--brand); color:var(--brand-text); border-color:var(--brand); font-weight:600; }
  .v-file { display:flex; justify-content:space-between; gap:8px; align-items:center; border:1px dashed var(--line); border-radius:10px; padding:8px 12px; margin:4px 0; overflow-wrap:anywhere; }
  .v-file.ok { border-style:solid; border-color:var(--ok); }
  .v-saved { font-size:14px; color:var(--muted); }
  .v-req { color:var(--bad); }
  .v-flow { padding-left:0; list-style:none; margin:6px 0; }
  .v-flow li { display:flex; gap:10px; margin:6px 0; } .v-flow li span { flex:0 0 26px; height:26px; border-radius:50%; background:var(--chip); display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
  .v-flow li.done span { background:var(--ok); color:#fff; } .v-flow li.todo { color:var(--muted); }
  input, select, textarea { width:100%; }
  dl.kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:8px 0; } dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; overflow-wrap:anywhere; }
  @media (max-width:520px) { dl.kv { grid-template-columns:1fr; } dl.kv dd { margin-bottom:6px; } }
  /* หนังสือแจ้งผล: A4 · TH Sarabun 16pt · ไม่ตัดคำกลางบรรทัด */
  @font-face { font-family:'THSarabunNew'; src:url('vendor/fonts/THSarabunNew.woff') format('woff'); font-weight:400; }
  @font-face { font-family:'THSarabunNew'; src:url('vendor/fonts/THSarabunNew-Bold.woff') format('woff'); font-weight:700; }
  .letter { background:#fff; color:#000; font-family:'TH Sarabun New','THSarabunNew',serif; font-size:16pt; line-height:1.35; padding:2cm 2cm 1.5cm 3cm; border:1px solid var(--line);
            word-break:keep-all; overflow-wrap:normal; line-break:strict; }
  .letter p { margin:0 0 6pt; } .letter .c { text-align:center; } .letter .r { text-align:right; } .letter .ind { text-indent:2.5cm; }
  .letter table { border-collapse:collapse; width:100%; font-size:16pt; margin:6pt 0; } .letter td, .letter th { border:1px solid #000; padding:2pt 6pt; color:#000; }
  .letter .sign { margin-top:28pt; margin-left:45%; text-align:center; }
  .letter .foot { margin-top:24pt; font-size:13pt; border-top:1px solid #000; padding-top:4pt; }
  .letter .nw { white-space:nowrap; } .letter .url { word-break:break-all; }
  .letter-wrap { overflow-x:auto; }
  @media screen and (max-width:700px) { .letter { padding:18px 14px; font-size:14pt; } .letter .ind { text-indent:1.2cm; } .letter .sign { margin-left:30%; } .letter table { font-size:12pt; } }
  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; } body > *:not(main) { display:none !important; } main.v { max-width:none; padding:0; }
    main.v > *:not(.letter) { display:none !important; } .letter { border:0; }
  }
</style>
</head>
<body>
<a class="skip" href="#view">ข้ามไปเนื้อหา</a>
<header class="top"><div class="top-in"><p class="brand">คำขอวางประเมินวัสดุการแพทย์</p><span class="spacer"></span><span class="who" id="who"></span><button class="secondary small" id="logout" type="button" hidden>ออกจากระบบ</button></div></header>
<main class="v" id="view" tabindex="-1"><div class="card muted" role="status">กำลังโหลด...</div></main>
<div id="toast-area" aria-live="polite"></div>
<script src="config.js"></script>
<script src="vendor.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.VendorInitGoogle && window.VendorInitGoogle()"
        onerror="window.VendorGoogleFailed && window.VendorGoogleFailed()"></script>
</body>
</html>
