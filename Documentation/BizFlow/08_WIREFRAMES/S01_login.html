<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BizFlow wireframe — เข้าสู่ระบบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="wf.css"></head>
<body style="display:grid;place-items:center;min-height:100vh">
<div class="card" style="width:380px;max-width:calc(100vw - 32px);padding:28px">
 <div class="brand" style="padding:0 0 18px"><div class="mark">B</div><div><b>BizFlow</b><span>ระบบเอกสารขายและรับชำระเงิน</span></div></div>
 <div class="stack" style="gap:12px">
  <div class="field"><label>อีเมล</label><div class="input">owner@example.com</div></div>
  <div class="field"><label>รหัสผ่าน</label><div class="input">••••••••••••</div></div>
  <div class="field"><label>รหัสยืนยัน 6 หลัก (ถ้าเปิด MFA) <span class="pin">1</span></label><div class="input">— — — — — —</div></div>
  <button class="btn primary" style="justify-content:center">เข้าสู่ระบบ</button>
  <div class="note err small">อีเมลหรือรหัสผ่านไม่ถูกต้อง <span class="pin">2</span></div>
  <div class="small muted" style="text-align:center">ไม่มีการสมัครสมาชิก — ระบบสำหรับผู้ใช้ที่กำหนดเท่านั้น</div>
 </div></div>
<div class="wfbadge" style="position:fixed;top:12px;right:12px">Wireframe · ข้อมูลสมมติ</div></body></html>
