<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเอกสารงานวัสดุการแพทย์</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#view">ข้ามไปเนื้อหา</a>

<header class="top">
  <div class="top-in">
    <h1 class="brand">ระบบเอกสารงานวัสดุการแพทย์</h1>
    <span class="env" title="สภาพแวดล้อมทดสอบ ยังไม่ใช่ระบบใช้งานจริง">ทดสอบ</span>
    <span class="spacer"></span>
    <div class="who hidden" id="who"></div>
    <button class="secondary small hidden" id="logout" type="button">ออกจากระบบ</button>
  </div>
  <nav class="main hidden" id="nav" aria-label="เมนูหลัก"></nav>
</header>

<main id="main">
  <section id="login-view" class="card">
    <h2>เข้าสู่ระบบด้วยบัญชี Google</h2>
    <p class="muted">ใช้ได้เฉพาะบัญชีที่ผู้ดูแลระบบลงทะเบียนไว้แล้ว</p>
    <div id="login-area" class="muted">กำลังโหลดปุ่มเข้าสู่ระบบ...</div>
    <p id="login-result" role="status" aria-live="polite"></p>
  </section>
  <section id="view" tabindex="-1" class="hidden" aria-live="polite"></section>
</main>

<footer class="muted"><a href="privacy.html">นโยบายความเป็นส่วนตัว</a></footer>
<div id="toast-area" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.MedsupInitGoogle && window.MedsupInitGoogle()"
        onerror="document.getElementById('login-area').textContent = 'โหลดสคริปต์ Google Sign-In ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต'"></script>
</body>
</html>
