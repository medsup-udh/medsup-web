<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Sarabun', 'Tahoma', sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #1f2933; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; max-width: 720px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    code { background: #eef1f5; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    button { font: inherit; padding: 8px 16px; border: 0; border-radius: 6px; background: #1b6ec2; color: #fff; cursor: pointer; }
    button:disabled { background: #9aa5b1; cursor: progress; }
    input { font: inherit; width: 80px; padding: 6px; }
    .pass { color: #0a7a3e; font-weight: bold; }
    .fail { color: #c0392b; font-weight: bold; }
    .muted { color: #616e7c; font-size: 14px; }
    pre { background: #eef1f5; padding: 8px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>C1 — ทดสอบระบบพื้นฐาน</h1>
    <div class="muted">สภาพแวดล้อม: <b><?= env ?></b></div>
  </div>

  <div class="card">
    <h2>ขั้นที่ 1: Origin ของหน้านี้</h2>
    <div class="muted">คัดลอกค่านี้ไปใส่ช่อง "Authorized JavaScript origins" ใน Google Cloud Console</div>
    <p><code id="origin"></code></p>
  </div>

  <div class="card">
    <h2>ขั้นที่ 2: เข้าสู่ระบบด้วย Google</h2>
    <div id="login-area"></div>
    <p id="login-result"></p>
  </div>

  <div class="card">
    <h2>ขั้นที่ 3: ทดสอบบันทึกพร้อมกัน</h2>
    <div class="muted">ส่งคำสั่งบันทึกพร้อมกันหลายรายการ แล้วตรวจว่าไม่มีรายการซ้ำหรือหาย</div>
    <p>จำนวน: <input id="n" type="number" min="1" max="200" value="50">
      <button id="run" disabled>เริ่มทดสอบ</button></p>
    <div id="load-result"></div>
  </div>

  <script>
    var CLIENT_ID = <?!= JSON.stringify(clientId) ?>;
    var session = null;

    document.getElementById('origin').textContent = window.location.origin;

    function callApi(action, payload) {
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function () {
            resolve({ ok: false, code: 'NETWORK', message: 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่' });
          })
          .api({ action: action, session: session, payload: payload || {} });
      });
    }

    function show(id, html) { document.getElementById(id).innerHTML = html; }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

    function initGoogle() {
      if (!CLIENT_ID) {
        show('login-area', '<span class="fail">ยังไม่ได้ตั้งค่า GOOGLE_CLIENT_ID ใน Script Properties</span>');
        return;
      }
      try {
        google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
        google.accounts.id.renderButton(document.getElementById('login-area'), { theme: 'outline', size: 'large', locale: 'th' });
      } catch (e) {
        show('login-area', '<span class="fail">โหลดปุ่ม Google ไม่สำเร็จ: ' + esc(e.message) + '</span>');
      }
    }

    function onCredential(resp) {
      show('login-result', 'กำลังตรวจสอบ...');
      callApi('auth.login', { id_token: resp.credential }).then(function (r) {
        if (!r.ok) { show('login-result', '<span class="fail">' + esc(r.message) + ' (' + esc(r.code) + (r.ref ? ' ' + esc(r.ref) : '') + ')</span>'); return; }
        session = r.data.session;
        return callApi('auth.whoami').then(function (w) {
          if (!w.ok) { show('login-result', '<span class="fail">whoami ล้มเหลว: ' + esc(w.code) + '</span>'); return; }
          show('login-result', '<span class="pass">ผ่าน</span> — เข้าสู่ระบบเป็น <b>' + esc(w.data.email) + '</b>');
          document.getElementById('run').disabled = false;
        });
      });
    }

    function newRunId() {
      return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
    }

    document.getElementById('run').addEventListener('click', function () {
      var btn = this;
      var n = Math.max(1, Math.min(200, parseInt(document.getElementById('n').value, 10) || 50));
      var runId = newRunId();
      btn.disabled = true;
      btn.textContent = 'กำลังดำเนินการ...';
      show('load-result', 'กำลังส่ง ' + n + ' รายการพร้อมกัน...');
      var started = Date.now();

      var calls = [];
      for (var i = 1; i <= n; i++) calls.push(callApi('spike.write', { run_id: runId, client_seq: i }));

      Promise.all(calls).then(function (results) {
        var elapsed = ((Date.now() - started) / 1000).toFixed(1);
        var ok = results.filter(function (r) { return r.ok; }).length;
        var errors = {};
        results.forEach(function (r) { if (!r.ok) errors[r.code] = (errors[r.code] || 0) + 1; });

        return callApi('spike.stats', { run_id: runId }).then(function (s) {
          if (!s.ok) { show('load-result', '<span class="fail">อ่านผลไม่สำเร็จ: ' + esc(s.code) + '</span>'); return; }
          var d = s.data;
          var pass = ok === n && d.run_rows === ok && d.duplicate_seq_all === 0 &&
                     d.out_of_order_all === 0 && d.run_duplicate_client_seq === 0;
          show('load-result',
            '<p class="' + (pass ? 'pass">ผ่าน' : 'fail">ไม่ผ่าน') + '</p>' +
            '<pre>' + esc(JSON.stringify({
              run_id: runId, sent: n, success: ok, errors: errors, seconds: elapsed, sheet: d
            }, null, 2)) + '</pre>' +
            '<div class="muted">กรุณาคัดลอกผลในกรอบนี้ส่งกลับมา</div>');
        });
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = 'เริ่มทดสอบ';
      });
    });
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"
          onerror="show('login-area', '<span class=&quot;fail&quot;>โหลดสคริปต์ Google Sign-In ไม่สำเร็จ</span>')"></script>
</body>
</html>
